operations:
  view:
    - type: web
      impl: index.html
actions: actions
web: web-src
hooks:
  post-app-deploy: ./hooks/post-deploy.js
runtimeManifest:
  packages:
    aem-assets-assetsview-1:
      license: Apache-2.0
      actions:
        generate-idapi-banners:
          function: actions/generate-idapi-banners/index.js
          web: 'yes'
          runtime: nodejs:22
          inputs:
            LOG_LEVEL: debug
            # InDesign API (Firefly Services) — OAuth Server-to-Server credential
            FFS_CLIENT_ID: $FFS_CLIENT_ID
            FFS_CLIENT_SECRET: $FFS_CLIENT_SECRET
            FFS_ORG_ID: $FFS_ORG_ID
            FFS_SCOPES: $FFS_SCOPES
            IMS_ENDPOINT: $IMS_ENDPOINT
            INDESIGN_EXECUTE_URL: $INDESIGN_EXECUTE_URL
            # Input staging uses Adobe I/O Files (@adobe/aio-lib-files) — storage
            # provisioned with the app; no external bucket/SAS to configure.
            # AEM author + the action's own AEM auth (read inputs / write outputs).
            # AEM_SC_JSON (base64 Service Credential) is durable; AEM_DEV_TOKEN is a
            # dev-token fallback.
            AEM_AUTHOR_URL: $AEM_AUTHOR_URL
            AEM_SC_JSON: $AEM_SC_JSON
            AEM_DEV_TOKEN: $AEM_DEV_TOKEN
            # Shared brand-fonts folder in the DAM (staged into the job's
            # "Document Fonts/"). Optional per-job <folder>/fonts overrides it.
            AEM_FONTS_PATH: $AEM_FONTS_PATH
            ASSETS_VIEW_TENANT: $ASSETS_VIEW_TENANT
          limits:
            timeout: 600000      # 10 min — render + AEM write-back is long-running
            memorySize: 512
          annotations:
            # We authenticate by *using* the caller's token for AEM (the action
            # requires the Authorization header). The gateway auth-wrapper
            # (require-adobe-auth) deploys only __secured_* without the public
            # sequence in this namespace, which 404s — so validate in-action instead.
            require-adobe-auth: false
            final: true
        generate-idapi-banners-worker:
          function: actions/generate-idapi-banners-worker.js
          web: 'yes'
          runtime: nodejs:22
          inputs:
            LOG_LEVEL: debug
            FFS_CLIENT_ID: $FFS_CLIENT_ID
            FFS_CLIENT_SECRET: $FFS_CLIENT_SECRET
            FFS_ORG_ID: $FFS_ORG_ID
            FFS_SCOPES: $FFS_SCOPES
            IMS_ENDPOINT: $IMS_ENDPOINT
            INDESIGN_EXECUTE_URL: $INDESIGN_EXECUTE_URL
            AEM_AUTHOR_URL: $AEM_AUTHOR_URL
            AEM_SC_JSON: $AEM_SC_JSON
            AEM_DEV_TOKEN: $AEM_DEV_TOKEN
            AEM_FONTS_PATH: $AEM_FONTS_PATH
            PSD_HERO_FRAME_ASPECT: $PSD_HERO_FRAME_ASPECT
            # HTML5 (DA pages + EDS preview). Pages are written as the signed-in user (the start
            # action passes their IMS token through; it is never stored). Optional overrides:
            # DA_TOKEN (a token DA accepts for this site), EDS_ADMIN_TOKEN (an EDS admin API key).
            # The render service token is never used for DA.
            DA_TOKEN: $DA_TOKEN
            EDS_ADMIN_TOKEN: $EDS_ADMIN_TOKEN
          limits:
            timeout: 600000
            memorySize: 2048   # PSD templates (~60 MB) + embedded-image outputs overflowed 512 MB
          annotations:
            final: true
        generate-idapi-banners-status:
          function: actions/generate-idapi-banners-status.js
          web: 'yes'
          runtime: nodejs:22
          inputs:
            AEM_AUTHOR_URL: $AEM_AUTHOR_URL
            AEM_SC_JSON: $AEM_SC_JSON
            AEM_DEV_TOKEN: $AEM_DEV_TOKEN
            ASSETS_VIEW_TENANT: $ASSETS_VIEW_TENANT
          limits:
            timeout: 30000
            memorySize: 256
          annotations:
            final: true
        generate-idapi-banners-package:
          function: actions/generate-idapi-banners-package.js
          web: 'yes'
          runtime: nodejs:22
          inputs:
            AEM_AUTHOR_URL: $AEM_AUTHOR_URL
            AEM_SC_JSON: $AEM_SC_JSON
            AEM_DEV_TOKEN: $AEM_DEV_TOKEN
            GITHUB_DISPATCH_TOKEN: $GITHUB_DISPATCH_TOKEN
            HTML5_WRITEBACK_SECRET: $HTML5_WRITEBACK_SECRET
            HTML5_WRITEBACK_URL: $HTML5_WRITEBACK_URL
            ASSETS_VIEW_TENANT: $ASSETS_VIEW_TENANT
          limits:
            timeout: 60000
            memorySize: 256
          annotations:
            final: true
        # Called by the banner-ads packaging workflow, which has no Adobe identity; it is
        # authorised by the HMAC writeback token minted by generate-idapi-banners-package.
        html5-writeback:
          function: actions/html5-writeback.js
          web: 'yes'
          runtime: nodejs:22
          inputs:
            AEM_AUTHOR_URL: $AEM_AUTHOR_URL
            AEM_SC_JSON: $AEM_SC_JSON
            AEM_DEV_TOKEN: $AEM_DEV_TOKEN
            HTML5_WRITEBACK_SECRET: $HTML5_WRITEBACK_SECRET
          limits:
            timeout: 180000
            memorySize: 512
          annotations:
            require-adobe-auth: false
            final: true
